# CI/CD for rainbird-ai.
#
# Every merge request, branch and tag runs the checks, the tests on each supported Python, the
# build and a test of the built wheel. A release tag (vX.Y.Z, matching the package version) adds
# two manual jobs: publish to TestPyPI, which is then installed back and tested, and only after
# that publish the same files to PyPI.
#
# Uploads use PyPI trusted publishing (no stored secret): twine >= 6.1 exchanges the GitLab OIDC
# token in PYPI_ID_TOKEN / TESTPYPI_ID_TOKEN for a short-lived upload token. To use API tokens
# instead, add masked, protected CI/CD variables PYPI_API_TOKEN / TESTPYPI_API_TOKEN.

stages:
  - check
  - test
  - build
  - verify
  - testpypi
  - testpypi-verify
  - pypi

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the merge request pipeline covers this push
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.13-slim
  interruptible: true
  cache:
    key: pip
    paths:
      - .cache/pip

# --------------------------------------------------------------------------- checks

lint:
  stage: check
  script:
    - python -m pip install "ruff==0.17.1" # pinned so a new ruff release cannot break CI
    - ruff check src tests
    - ruff format --check src tests

typecheck:
  stage: check
  script:
    - python -m pip install -e ".[dev]" "mypy==2.4.0"
    - mypy

# --------------------------------------------------------------------------- tests

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  script:
    - python -m pip install -e ".[dev]"
    - >
      python -m pytest -p no:cacheprovider --junitxml=report.xml
      --cov=rainbird_ai --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL\s.*\s(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-min-deps:
  stage: test
  image: python:3.11-slim
  script:
    # The oldest versions pyproject.toml allows, on the oldest supported Python.
    - python -m pip install -e ".[dev]" "httpx==0.28.0" "anyio==4.0.0"
    - python -m pip list | grep -iE '^(httpx|anyio) '
    - python -m pytest -p no:cacheprovider --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# --------------------------------------------------------------------------- build

build:
  stage: build
  script:
    - python -m pip install build "twine>=6.1"
    - python -m build
    - twine check --strict dist/*
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        wheel="dist/rainbird_ai-${CI_COMMIT_TAG#v}-py3-none-any.whl"
        if [ ! -f "$wheel" ]; then
          echo "Tag $CI_COMMIT_TAG does not match the package version (no $wheel):"
          ls dist
          exit 1
        fi
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# Install the built wheel (not the source tree) and run the test suite against it.
test-package:
  stage: verify
  image: python:3.11-slim
  dependencies: [build]
  script:
    - python -m pip install dist/*.whl pytest
    - rainbird --version
    - mkdir -p /tmp/package-test && cp -r tests /tmp/package-test/
    - cd /tmp/package-test && python -I -m pytest -q -p no:cacheprovider tests

# --------------------------------------------------------------------------- release (tags only)

publish-testpypi:
  stage: testpypi
  dependencies: [build]
  interruptible: false
  environment:
    name: testpypi
    url: https://test.pypi.org/project/rainbird-ai/
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false # the pipeline waits here until someone runs it
  script:
    - python -m pip install "twine>=6.1"
    - if [ -n "${TESTPYPI_API_TOKEN:-}" ]; then export TWINE_PASSWORD="$TESTPYPI_API_TOKEN"; fi
    # --skip-existing makes a retry safe: TestPyPI never accepts the same file twice.
    - twine upload --non-interactive --repository testpypi --skip-existing dist/*

# Install the release back from TestPyPI and test it before PyPI is allowed.
verify-testpypi:
  stage: testpypi-verify
  image: python:3.11-slim
  dependencies: [build]
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    # Dependencies come from PyPI (via the built wheel's metadata), never from TestPyPI.
    - python -m pip install dist/*.whl pytest
    - python -m pip uninstall -y rainbird-ai
    - |
      for attempt in $(seq 1 10); do
        if python -m pip install --no-cache-dir --no-deps \
            --index-url https://test.pypi.org/simple/ "rainbird-ai==${VERSION}"; then
          break
        fi
        if [ "$attempt" = 10 ]; then
          echo "rainbird-ai ${VERSION} did not appear on TestPyPI"
          exit 1
        fi
        echo "Not on TestPyPI yet (attempt ${attempt}/10); retrying in 30 s"
        sleep 30
      done
    - python -m pip check
    - test "$(rainbird --version)" = "rainbird-ai ${VERSION}"
    - mkdir -p /tmp/package-test && cp -r tests /tmp/package-test/
    - cd /tmp/package-test && python -I -m pytest -q -p no:cacheprovider tests

publish-pypi:
  stage: pypi
  dependencies: [build]
  interruptible: false
  environment:
    name: pypi
    url: https://pypi.org/project/rainbird-ai/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false
  script:
    - python -m pip install "twine>=6.1"
    - if [ -n "${PYPI_API_TOKEN:-}" ]; then export TWINE_PASSWORD="$PYPI_API_TOKEN"; fi
    # No --skip-existing: uploading a version that is already on PyPI should fail loudly.
    - twine upload --non-interactive dist/*
