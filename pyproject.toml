[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "rainbird-ai"
dynamic = ["version"]
description = "Python SDK for the Rainbird decision intelligence API: sessions, queries, questions and answers, evidence, natural language, and knowledge map management."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julio Diez Tomillo", email = "julio@rainbird.ai" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0", "anyio>=4"]
keywords = [
  "rainbird", "api", "sdk", "knowledge-map", "knowledge-graph", "reasoning",
  "decision-intelligence", "explainable-ai", "rblang",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/juliodt-ai/rainbird-python-sdk"
Documentation = "https://docs.rainbird.ai/rainbird/developer-docs/overview"
"API Reference" = "https://rainbird.redoc.ly/"
Source = "https://github.com/juliodt-ai/rainbird-python-sdk"
Issues = "https://github.com/juliodt-ai/rainbird-python-sdk/issues"
Changelog = "https://github.com/juliodt-ai/rainbird-python-sdk/blob/main/CHANGELOG.md"

[project.scripts]
rainbird = "rainbird_ai.cli:main"

[tool.hatch.version]
path = "src/rainbird_ai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rainbird_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/rainbird_ai", "tests", "README.md", "LICENSE", "CHANGELOG.md", "AGENTS.md", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests that call the real Rainbird API (need RAINBIRD_API_KEY and RAINBIRD_KM_ID)",
]

[tool.coverage.run]
branch = true
source = ["rainbird_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "C4", "PIE", "RET", "TCH"]
ignore = [
  "PLR0913",  # many arguments: SDK methods mirror API parameters
  "PLR0912",  # many branches in parsers
  "PLR0911",  # many returns in parsers
  "PLR2004",  # magic values (HTTP status codes) are readable inline
  "RUF012",   # mutable class attributes on argparse helpers
  "TC001", "TC002", "TC003",  # runtime imports are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "B011", "RUF", "SIM", "E501", "PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
